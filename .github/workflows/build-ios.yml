
name: Build LUMEN Studio iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Repository root:"
          pwd
          ls -la

          if [ ! -f package.json ]; then
            echo "::error::package.json was not found at the repository root."
            exit 1
          fi

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            echo "::error::No Capacitor configuration was found at the repository root."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm install

      - name: Match Capacitor iOS version
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          echo "Capacitor core version: $CAP_VERSION"
          npm install "@capacitor/ios@$CAP_VERSION"

      - name: Build web app
        run: npm run build

      - name: Add iOS platform if needed
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          else
            echo "iOS platform already exists."
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app artifact
        run: |
          APP_PATH="build/ios/Build/Products/Debug-iphonesimulator/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::The expected iOS Simulator app was not generated."
            find build/ios -maxdepth 6 -name '*.app' -print
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "Lumen-Studio-iOS-Simulator.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Studio-iOS-Simulator
          path: Lumen-Studio-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
