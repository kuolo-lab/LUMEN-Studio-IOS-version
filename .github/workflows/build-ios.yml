
name: Build LUMEN Studio iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and check project directory
        shell: bash
        run: |
          echo "Searching for the LUMEN Studio project..."

          PACKAGE=$(find . -maxdepth 5 \
            -type f -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "::error::No package.json found in the repository."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          if [ ! -f "$PROJECT_DIR/capacitor.config.ts" ] && \
             [ ! -f "$PROJECT_DIR/capacitor.config.json" ] && \
             [ ! -f "$PROJECT_DIR/capacitor.config.js" ] && \
             [ ! -f "$PROJECT_DIR/capacitor.config.mjs" ]; then
            echo "::error::No Capacitor configuration found beside package.json."
            echo "Project directory: $PROJECT_DIR"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Match Capacitor iOS version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          echo "Capacitor core version: $CAP_VERSION"
          npm install "@capacitor/ios@$CAP_VERSION"

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Add iOS platform if needed
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          else
            echo "iOS platform already exists."
          fi

      - name: Sync Capacitor iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync ios

      - name: Build iOS Simulator app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APP_PATH="build/ios/Build/Products/Debug-iphonesimulator/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::The expected iOS Simulator app was not generated."
            find build/ios -maxdepth 6 -name '*.app' -print
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "Lumen-Studio-iOS-Simulator.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Studio-iOS-Simulator
          path: ${{ env.PROJECT_DIR }}/Lumen-Studio-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
